# cicdkit-lume —— 控制面 + 内网 runner（取代 cicdkit 容器）
#
# 两个服务，职责不重叠：
#    cicdkit-lume  控制面：界面 / API / 状态（SQLite）/ 审批闸门 / LLM 诊断
#    runner        执行器：只按 argv 跑 docker/kubectl/helm/ssh，流式写日志
#
# 共享一个日志目录，因为控制面按**字节偏移**增量读 runner 写的日志：
#   ./.data/logs（宿主机）→ 控制面 /app/.data/logs、runner /logs
# 两者必须指向同一个卷，否则前端永远看到空日志。
#
#   make docker            # 构建 + 起两个服务
#   make docker-logs       # 跟控制面日志
#   make docker-down       # 停掉

services:
  cicdkit-lume:
    build:
      context: .
      # lume 二进制来源。本机默认取自编的 lume-bin:0.14.2（动态路由全走 worker 池 +
      # 池/队列指标 + 大静态文件在主循环非阻塞流式，不占 worker）。
      args:
        LUME_BIN_IMAGE: ${LUME_BIN_IMAGE:-lume-bin:0.14.2}
    image: cicdkit-lume:dev
    container_name: cicdkit-lume
    ports:
      - "127.0.0.1:18107:18107"
    environment:
      LUME_BIND: 0.0.0.0
      LUME_PORT: "18107"
      LUME_DATA: /app/.data
      RUNNER_BASE: http://runner:8899
      # runner 的令牌与 cicdkit 的 CICD_AUTH 同一个坑：env 名含 TOKEN 会被
      # Lume 的 env() 屏蔽，所以这里叫 RUNNER_AUTH。
      RUNNER_AUTH: ${RUNNER_AUTH:-change-me-runner}
      CICD_DEPLOY_APPROVAL: ${CICD_DEPLOY_APPROVAL:-off}
      # 项目配置里存的是**宿主绝对路径**，runner 又是按宿主路径解析 context 的，
      # 所以控制面必须也挂同一批路径、用同一个值做允许根 —— 再映射到 /projects
      # 只会让同一份配置在两边指向不同目录，validation 过、构建找不到文件。
      CICD_WORK_DIR: ${PROJECTS_ROOT:?先设置 PROJECTS_ROOT（宿主项目根绝对路径）}
      CICD_FS_ROOTS: ${PROJECTS_ROOT:?}
      # local-k3s / kubectl 用的 kubeconfig：路径必须两边都看得见。
      CICD_DEFAULT_KUBECONFIG: ${CICD_DEFAULT_KUBECONFIG:-}
      # 角色口令绑定（可选）：配了之后 ?role= 不再作数，只能 ?pass=
      CICD_ROLE_MAP: ${CICD_ROLE_MAP:-}
      # A2A / peer 签名面（可选）：不配则整面 fail-closed 关闭
      CICDKIT_PEER_SHARED: ${CICDKIT_PEER_SHARED:-}
      CICDKIT_PEER_ROOT: ${CICDKIT_PEER_ROOT:-}
      CICDKIT_PEER_NAME: ${CICDKIT_PEER_NAME:-cicdkit-lume}
      CICDKIT_PEERS: ${CICDKIT_PEERS:-}
      CICD_SSH_USER: ${CICD_SSH_USER:-}
      CICD_SSH_PORT: ${CICD_SSH_PORT:-}
      CICD_SSH_KEY_PATH: ${CICD_SSH_KEY_PATH:-}
    volumes:
      # 可写：SQLite（store.db）+ secrets/ + 运行日志（runner 追加写、这里读）。
      - ./.data:/app/.data
      # 项目目录按「相同绝对路径」挂进来：控制面只读它做校验/浏览，
      # 但路径必须和 runner 侧完全一致，否则 docker build 的 context 解析不到。
      - ${PROJECTS_ROOT:?}:${PROJECTS_ROOT:?}
      # 历史凭据（kubeconfig、ssh key）也按宿主原路径挂，配置里存的就是这个路径。
      - ${LEGACY_DATA:-./.data/legacy}:${LEGACY_DATA:-/legacy}:ro
    depends_on:
      runner:
        condition: service_healthy
    restart: unless-stopped

  runner:
    build:
      context: ./runner
    image: cicdkit-runner:dev
    container_name: cicdkit-runner
    # 不映射到宿主机：runner 只该被控制面访问（内网 compose 网络）。
    expose:
      - "8899"
    environment:
      RUNNER_BIND: 0.0.0.0:8899
      RUNNER_LOG_DIR: /logs
      RUNNER_AUTH: ${RUNNER_AUTH:-change-me-runner}
      RUNNER_ALLOW: ${RUNNER_ALLOW:-docker,kubectl,helm,ssh,scp,git,sudo}
      RUNNER_MAX_JOBS: ${RUNNER_MAX_JOBS:-4}
    volumes:
      # 与控制面共享日志目录（字节偏移增量读的前提）。
      - ./.data/logs:/logs
      # 宿主 docker daemon：runner 不跑自己的 docker-in-docker。
      - /var/run/docker.sock:/var/run/docker.sock
      # 项目目录：必须与宿主相同路径，否则 docker build 的 context 解析不到。
      - ${PROJECTS_ROOT:?}:${PROJECTS_ROOT:?}
      # SSH 私钥 / kubeconfig：项目配置里写的是宿主绝对路径，原路径挂进来才认。
      - ${LEGACY_DATA:-./.data/legacy}:${LEGACY_DATA:-/legacy}:ro
    restart: unless-stopped
