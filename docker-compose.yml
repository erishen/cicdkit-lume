# cicdkit-lume —— 控制面 + 内网 runner（取代 cicdkit 容器）
#
# 两个服务，职责不重叠：
#    cicdkit-lume  控制面：界面 / API / 状态（SQLite）/ 审批闸门 / LLM 诊断
#    runner        执行器：只按 argv 跑 docker/kubectl/helm/ssh，流式写日志
#
# 共享一个日志目录，因为控制面按**字节偏移**增量读 runner 写的日志：
#   ./.data/logs（宿主机）→ 控制面 /app/.data/logs、runner /logs
# 两者必须指向同一个卷，否则前端永远看到空日志。
#
#   make docker            # 构建 + 起两个服务
#   make docker-logs       # 跟控制面日志
#   make docker-down       # 停掉

services:
  cicdkit-lume:
    build:
      context: .
      # lume 二进制来源。本机默认取自编的 lume-bin:0.14.2（动态路由全走 worker 池 +
      # 池/队列指标 + 大静态文件在主循环非阻塞流式，不占 worker）。
      args:
        LUME_BIN_IMAGE: ${LUME_BIN_IMAGE:-lume-bin:0.14.2}
    image: cicdkit-lume:dev
    container_name: cicdkit-lume
    ports:
      - "127.0.0.1:18107:18107"
    environment:
      LUME_BIND: 0.0.0.0
      LUME_PORT: "18107"
      LUME_DATA: /app/.data
      RUNNER_BASE: http://runner:8899
      # runner 的令牌与 cicdkit 的 CICD_AUTH 同一个坑：env 名含 TOKEN 会被
      # Lume 的 env() 屏蔽，所以这里叫 RUNNER_AUTH。
      # 必须显式注入：make docker 会自动生成 .data/runner.token 并传进来。
      RUNNER_AUTH: ${RUNNER_AUTH:?先设置 RUNNER_AUTH（make docker 会自动生成）}
      CICD_DEPLOY_APPROVAL: ${CICD_DEPLOY_APPROVAL:-off}
      # 项目配置里存的是**宿主绝对路径**，runner 又是按宿主路径解析 context 的，
      # 所以控制面必须也挂同一批路径、用同一个值做允许根 —— 再映射到 /projects
      # 只会让同一份配置在两边指向不同目录，validation 过、构建找不到文件。
      CICD_WORK_DIR: ${PROJECTS_ROOT:?先设置 PROJECTS_ROOT（宿主项目根绝对路径）}
      CICD_FS_ROOTS: ${PROJECTS_ROOT:?}
      # local-k3s / kubectl 用的 kubeconfig：路径必须两边都看得见。
      CICD_DEFAULT_KUBECONFIG: ${CICD_DEFAULT_KUBECONFIG:-}
      # 角色口令绑定（可选）：配了之后 ?role= 不再作数，只能 ?pass=
      CICD_ROLE_MAP: ${CICD_ROLE_MAP:-}
      # A2A / peer 签名面（可选）：不配则整面 fail-closed 关闭
      CICDKIT_PEER_SHARED: ${CICDKIT_PEER_SHARED:-}
      CICDKIT_PEER_ROOT: ${CICDKIT_PEER_ROOT:-}
      CICDKIT_PEER_NAME: ${CICDKIT_PEER_NAME:-cicdkit-lume}
      CICDKIT_PEERS: ${CICDKIT_PEERS:-}
      CICD_SSH_USER: ${CICD_SSH_USER:-}
      CICD_SSH_PORT: ${CICD_SSH_PORT:-}
      CICD_SSH_KEY_PATH: ${CICD_SSH_KEY_PATH:-}
      # 归档保留条数（默认 1000）；留空即用代码默认。
      CICD_ARCHIVE_KEEP: ${CICD_ARCHIVE_KEEP:-}
      # Basic Auth：凭据由 `make auth` 生成在 ~/.config/cicdkit-lume，不进仓库。
      HTPASSWD_FILE: /auth/htpasswd
      # 身份绑定（参考 kb-abac）：Basic Auth 用户 → 账号表角色；读不到即 fail-closed。
      CICD_ACCOUNTS_FILE: /auth/accounts.json
      CICD_ACCOUNTS_ENFORCE: ${CICD_ACCOUNTS_ENFORCE:-1}
      # 资源/动作白名单：云环境快照、只读动作、重启动作分别登记。
      CICD_ACCESS_RESOURCES_FILE: /auth/resources.json
      CICD_AUDIT_KEEP: ${CICD_AUDIT_KEEP:-5000}
      CICD_ENV_AUDIT_KEEP: ${CICD_ENV_AUDIT_KEEP:-5000}
      CICD_A2A_TASK_KEEP: ${CICD_A2A_TASK_KEEP:-1000}
      CICD_RELEASE_KEEP: ${CICD_RELEASE_KEEP:-200}
      # 顶栏默认角色；单人用 cicd 账号时设为 human_admin，省去每次手切。
      CICD_DEFAULT_ROLE: ${CICD_DEFAULT_ROLE:-agent_operator}
    volumes:
      # 可写：SQLite（store.db）+ secrets/ + 运行日志（runner 追加写、这里读）。
      - ./.data:/app/.data
      # 项目目录按「相同绝对路径」挂进来：控制面只读它做校验/浏览，
      # 但路径必须和 runner 侧完全一致，否则 docker build 的 context 解析不到。
      - ${PROJECTS_ROOT:?}:${PROJECTS_ROOT:?}
      # 历史凭据（kubeconfig、ssh key）也按宿主原路径挂，配置里存的就是这个路径。
      - ${LEGACY_DATA:-./.data/legacy}:${LEGACY_DATA:-/legacy}:ro
      # 整个 auth 目录只读挂载：htpasswd、health-header、accounts.json 都在这里。
      - ${HOME}/.config/cicdkit-lume:/auth:ro
    # 开了 Basic Auth 后 /api/health 也要认证，健康检查必须带同一份凭据；
    # 这里覆盖 Dockerfile 里的匿名探针，否则容器会一直 unhealthy。
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header=\"Authorization: Basic $$(cat /auth/health-header)\" http://127.0.0.1:18107/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      runner:
        condition: service_healthy
    restart: unless-stopped
    # 并行期同时挂在 tsm-hub Prometheus 的共享网络上，Prometheus 才能按
    # 容器 DNS 名 cicdkit-lume:18107 抓 /metrics/cicdkit（不走宿主端口）。
    networks:
      - default
      - cicd-monitor

  runner:
    build:
      context: ./runner
    image: cicdkit-runner:dev
    container_name: cicdkit-runner
    # 不映射到宿主机：runner 只该被控制面访问（内网 compose 网络）。
    expose:
      - "8899"
    environment:
      RUNNER_BIND: 0.0.0.0:8899
      RUNNER_LOG_DIR: /logs
      # 必须显式注入：make docker 会自动生成 .data/runner.token 并传进来。
      RUNNER_AUTH: ${RUNNER_AUTH:?先设置 RUNNER_AUTH（make docker 会自动生成）}
      # 不再默认放行 sudo：runner 本身是 root，sudo 没有语义，只是多一条
      # 可被白名单放行的命令。
      RUNNER_ALLOW: ${RUNNER_ALLOW:-docker,kubectl,helm,ssh,scp,git}
      RUNNER_MAX_JOBS: ${RUNNER_MAX_JOBS:-4}
    volumes:
      # 与控制面共享日志目录（字节偏移增量读的前提）。
      - ./.data/logs:/logs
      # 宿主 docker daemon：runner 不跑自己的 docker-in-docker。
      - /var/run/docker.sock:/var/run/docker.sock
      # 项目目录：必须与宿主相同路径，否则 docker build 的 context 解析不到。
      - ${PROJECTS_ROOT:?}:${PROJECTS_ROOT:?}
      # SSH 私钥 / kubeconfig：项目配置里写的是宿主绝对路径，原路径挂进来才认。
      - ${LEGACY_DATA:-./.data/legacy}:${LEGACY_DATA:-/legacy}:ro
    restart: unless-stopped

  # 腾讯云安全组只开 8080 和 SSH，k3s API 6443 不对外。这里用 SSH 隧道把
  # 远端 6443 映到 compose 内网的 k3s-tunnel:16443，runner 里的 helm/kubectl
  # 就能用同一份 kubeconfig 访问；kubeconfig 里 server 写 k3s-tunnel:16443，
  # 并加 tls-server-name: 127.0.0.1 过 k3s 证书校验。
  k3s-tunnel:
    image: cicdkit-runner:dev
    container_name: cicdkit-k3s-tunnel
    entrypoint:
      - ssh
      - -N
      - -o
      - ExitOnForwardFailure=yes
      - -o
      - BatchMode=yes
      - -o
      - StrictHostKeyChecking=accept-new
      - -i
      - ${TENCENT_K3S_SSH_KEY:-/legacy/ssh_tencent_key}
      - -L
      - 0.0.0.0:16443:127.0.0.1:6443
      - ${TENCENT_K3S_SSH_HOST:-root@your-k3s-host}
    volumes:
      - ${LEGACY_DATA:-./.data/legacy}:/legacy:ro
    # 这个容器只跑 ssh -N 端口转发，不提供 runner 的 8899 健康检查；
    # 复用 cicdkit-runner 镜像时会被镜像里的 healthcheck 判成 unhealthy。
    healthcheck:
      disable: true
    restart: unless-stopped

networks:
  default: {}
  cicd-monitor:
    external: true
    name: cicd-monitor
